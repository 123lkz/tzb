<line x1="480" y1="292" x2="500" y2="292" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="720" y1="292" x2="740" y2="292" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="960" y1="292" x2="980" y2="292" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Prompt 模板说明 -->
