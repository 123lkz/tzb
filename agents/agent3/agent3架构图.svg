<text x="490" y="674" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="600">模式 A：--position "岗位名" | 一对一精确匹配</text>

<rect x="740" y="652" width="500" height="34" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1" filter="url(#shadow-sm)"/>
<text x="990" y="674" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="600">模式 B：--match-all | 遍历全部岗位，Top-K 排序</text>

