<text x="346" y="616" text-anchor="middle" fill="#64748b" font-size="9">required+optional vs 候选</text>

<rect x="429" y="580" width="142" height="46" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="500" y="598" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">经验匹配 (0.30)</text>
<text x="500" y="616" text-anchor="middle" fill="#64748b" font-size="9">年限+学历+行业背景</text>

<rect x="583" y="580" width="142" height="46" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
