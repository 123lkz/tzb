<text x="600" y="740" text-anchor="middle" fill="#64748b" font-size="10">highly_recommend</text>
<text x="600" y="756" text-anchor="middle" fill="#64748b" font-size="10">/ recommend / consider</text>

<rect x="740" y="700" width="200" height="70" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1" filter="url(#shadow)"/>
<text x="840" y="722" text-anchor="middle" fill="#c2410c" font-size="13" font-weight="600">证据链</text>
<text x="840" y="740" text-anchor="middle" fill="#64748b" font-size="10">逐技能匹配结果</text>
<text x="840" y="756" text-anchor="middle" fill="#64748b" font-size="10">+ 溯源 Provenance</text>

<rect x="980" y="700" width="260" height="70" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1" filter="url(#shadow)"/>
