<text x="125" y="660" text-anchor="middle" fill="#8b5cf6" font-size="11">Job Matching</text>
<rect x="60" y="715" width="130" height="24" rx="12" fill="#7c3aed"/><text x="125" y="731" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Step 2</text>
<rect x="60" y="743" width="130" height="24" rx="12" fill="#8b5cf6"/><text x="125" y="759" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">job_matching/</text>

