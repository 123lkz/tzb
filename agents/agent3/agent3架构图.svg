<text x="360" y="756" text-anchor="middle" fill="#64748b" font-size="10">三维评分 + 差距清单</text>

<rect x="500" y="700" width="200" height="70" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1" filter="url(#shadow)"/>
