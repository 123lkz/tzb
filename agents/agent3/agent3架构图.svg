<text x="875" y="558" text-anchor="middle" fill="#4338ca" font-size="13" font-weight="600">GapAnalyzer</text>
<text x="875" y="576" text-anchor="middle" fill="#64748b" font-size="10">可缺失必需技能 → 差距项</text>
<text x="875" y="594" text-anchor="middle" fill="#64748b" font-size="10">引用 SkillProfile 生成原因+建议</text>

<!-- MatchReportBuilder -->
<rect x="1010" y="536" width="230" height="70" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1" filter="url(#shadow-sm)"/>
<text x="1125" y="558" text-anchor="middle" fill="#4338ca" font-size="13" font-weight="600">MatchReportBuilder</text>
