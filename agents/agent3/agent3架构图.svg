<rect x="240" y="496" width="1020" height="200" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="240" y="496" width="1020" height="28" rx="8" fill="#8b5cf6"/>
<text x="750" y="515" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">job_matching/ — 人岗匹配模块</text>

