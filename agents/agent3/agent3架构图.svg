<line x1="740" y1="571" x2="760" y2="571" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="990" y1="571" x2="1010" y2="571" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 两种匹配模式 -->
