<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/></marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/></marker>
<linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4c1d95"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
</defs>

<!-- 标题 -->
<rect x="30" y="20" width="1340" height="36" rx="6" fill="url(#header-grad)"/>
<text x="700" y="44" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Agent 3 架构图：简历解析 + 人岗匹配</text>

<!-- ========== 左侧：层级标识 ========== -->
<rect x="30" y="75" width="1340" height="28" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
<text x="700" y="94" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="600">AI 智能体分析层（紫色） — 核心创新层 · 解决难题 3：高精度简历解析与人岗匹配</text>

<!-- ========== 第一部分：输入源 ========== -->
<rect x="40" y="116" width="170" height="120" rx="6" fill="#ede9fe"/>
<text x="125" y="168" text-anchor="middle" fill="#4c1d95" font-size="14" font-weight="700">输入源</text>
<text x="125" y="188" text-anchor="middle" fill="#8b5cf6" font-size="11">Input Sources</text>
<rect x="60" y="200" width="130" height="24" rx="12" fill="#8b5cf6"/><text x="125" y="216" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">外部输入</text>

<!-- 简历文件输入 -->
<rect x="240" y="120" width="260" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
<text x="370" y="142" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="600">简历文件输入</text>
<text x="370" y="160" text-anchor="middle" fill="#64748b" font-size="10">PDF / Word / TXT 格式</text>
<text x="370" y="174" text-anchor="middle" fill="#64748b" font-size="10">用户通过 CLI 提供文件路径</text>

<!-- MongoDB 输入 -->
<rect x="530" y="120" width="310" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
<text x="685" y="142" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="600">MongoDB · 来自 Agent2</text>
<text x="685" y="160" text-anchor="middle" fill="#64748b" font-size="10">jobs_kg（高置信度岗位-技能关系）</text>
<text x="685" y="174" text-anchor="middle" fill="#64748b" font-size="10">nlp_profiles（PositionProfile / SkillProfile）</text>

<!-- 输入描述标签 -->
<rect x="870" y="120" width="200" height="55" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
<text x="970" y="142" text-anchor="middle" fill="#b45309" font-size="14" font-weight="600">Agent2 复用</text>
<text x="970" y="160" text-anchor="middle" fill="#64748b" font-size="10">DeepSeekClient</text>
<text x="970" y="174" text-anchor="middle" fill="#64748b" font-size="10">ProfileStore</text>

<!-- 数据流箭头：输入 → 简历解析 -->
<line x1="370" y1="175" x2="370" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="685" y1="175" x2="685" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

<!-- ========== 第二部分：简历解析模块 ========== -->
<rect x="40" y="226" width="170" height="230" rx="6" fill="#f5f3ff"/>
<text x="125" y="330" text-anchor="middle" fill="#4c1d95" font-size="14" font-weight="700">简历解析</text>
<text x="125" y="350" text-anchor="middle" fill="#8b5cf6" font-size="11">Resume Parsing</text>
<rect x="60" y="395" width="130" height="24" rx="12" fill="#7c3aed"/><text x="125" y="411" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Step 1</text>
<rect x="60" y="423" width="130" height="24" rx="12" fill="#8b5cf6"/><text x="125" y="439" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">resume_parser/</text>

<!-- resume_parser 模块框 -->
<rect x="240" y="226" width="1020" height="105" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="240" y="226" width="1020" height="28" rx="8" fill="#8b5cf6"/>
<text x="750" y="245" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">resume_parser/ — 简历解析模块</text>

<!-- 子模块 -->
<rect x="260" y="266" width="220" height="52" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1" filter="url(#shadow-sm)"/>
<text x="370" y="286" text-anchor="middle" fill="#4338ca" font-size="13" font-weight="600">FileExtractor</text>
<text x="370" y="306" text-anchor="middle" fill="#64748b" font-size="10">PyMuPDF(pdf) / python-docx(docx) / txt</text>

<rect x="500" y="266" width="220" height="52" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1" filter="url(#shadow-sm)"/>
<text x="610" y="286" text-anchor="middle" fill="#4338ca" font-size="13" font-weight="600">SectionSplitter</text>
<text x="610" y="306" text-anchor="middle" fill="#64748b" font-size="10">纯规则正则段落分割</text>

<rect x="740" y="266" width="220" height="52" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1" filter="url(#shadow-sm)"/>
<text x="850" y="286" text-anchor="middle" fill="#4338ca" font-size="13" font-weight="600">ResumeParser</text>
<text x="850" y="306" text-anchor="middle" fill="#64748b" font-size="10">LLM NER 抽取 / 规则降级</text>

<rect x="980" y="266" width="260" height="52" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1" filter="url(#shadow-sm)"/>
<text x="1110" y="286" text-anchor="middle" fill="#4338ca" font-size="13" font-weight="600">ResumeProfile 模型</text>
<text x="1110" y="306" text-anchor="middle" fill="#64748b" font-size="10">Pydantic v2 · 含个人/教育/经验/技能</text>

