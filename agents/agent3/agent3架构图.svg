<text x="490" y="364" text-anchor="middle" fill="#b45309" font-size="12" font-weight="600">LLM Prompt 模板</text>
<text x="490" y="382" text-anchor="middle" fill="#64748b" font-size="10">简历解析 Prompt · 技能等价判断 Prompt · 职责覆盖判断 Prompt</text>
<text x="490" y="396" text-anchor="middle" fill="#64748b" font-size="10">所有 Prompt 要求结构化 JSON 输出 + 自然语言推理链</text>

<!-- 降级策略说明 -->
<rect x="760" y="344" width="500" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" filter="url(#shadow-sm)"/>
<text x="1010" y="364" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="600">降级策略：规则兜底</text>
<text x="1010" y="382" text-anchor="middle" fill="#64748b" font-size="10">未配置 LLM 时自动降级到正则提取（姓名/电话/邮箱/技能列表）</text>
<text x="1010" y="396" text-anchor="middle" fill="#64748b" font-size="10">输出 parsing_method = "rule", confidence = 0.4</text>

