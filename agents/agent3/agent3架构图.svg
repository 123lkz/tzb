<rect x="260" y="536" width="480" height="100" rx="8" fill="#fff" stroke="#c4b5fd" stroke-width="1" filter="url(#shadow)"/>
<rect x="260" y="536" width="480" height="32" rx="8" fill="#7c3aed"/>
<text x="500" y="557" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">MatchEngine · 三维匹配计算引擎</text>

