  <text x="480" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Nuxt 3 SSR (Nitro) — node-server</text>
  <text x="480" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#BFDBFE">Vite 7 构建 / TypeScript 严格模式 / TailwindCSS / ECharts 5</text>
  <line x1="480" y1="130" x2="480" y2="150" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
