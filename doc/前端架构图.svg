  <text x="175" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">API 调用层 (api.ts)</text>
  <line x1="50" y1="498" x2="300" y2="498" stroke="#93C5FD" stroke-width="0.5"/>
  <text x="175" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">callApi() → localhost:8720/api</text>
  <text x="175" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">15s 超时 + 自动回退 mock</text>
  <text x="175" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">USE_BACKEND 控制开关</text>
  <rect x="335" y="472" width="290" height="95" rx="5" fill="url(#boxGrad2)" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">模拟数据层 (mockData.ts)</text>
  <line x1="355" y1="498" x2="605" y2="498" stroke="#86EFAC" stroke-width="0.5"/>
  <text x="480" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">mockPositions (20条) + mockGraphData</text>
  <text x="480" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">generateMockReport() + filterPositions()</text>
  <text x="480" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">回退机制保障开发效率</text>
  <rect x="640" y="472" width="290" height="95" rx="5" fill="url(#boxGrad3)" stroke="#FDBA74" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="785" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9A3412">类型定义 (types/index.ts)</text>
  <line x1="660" y1="498" x2="910" y2="498" stroke="#FDBA74" stroke-width="0.5"/>
  <text x="785" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">PositionInfo / ResumeProfile</text>
  <text x="785" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">MatchReport / GraphData</text>
  <text x="785" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">全部 strict TypeScript</text>
  <line x1="480" y1="567" x2="480" y2="585" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="595" width="600" height="50" rx="25" fill="#1E3A5F" filter="url(#shadow)"/>
  <text x="480" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">连接后端 FastAPI → http://localhost:8720</text>
  <text x="480" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#93C5FD">fetchPositions / parseResume / matchPosition / insights/*</text>
  <text x="40" y="670" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">图例：</text>
  <rect x="90" y="658" width="14" height="14" rx="2" fill="url(#boxGrad1)" stroke="#93C5FD" stroke-width="1"/>
  <text x="108" y="669" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">网页层</text>
  <rect x="150" y="658" width="14" height="14" rx="2" fill="url(#boxGrad2)" stroke="#86EFAC" stroke-width="1"/>
  <text x="168" y="669" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">公共层</text>
  <rect x="210" y="658" width="14" height="14" rx="2" fill="url(#boxGrad3)" stroke="#FDBA74" stroke-width="1"/>
  <text x="228" y="669" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">布局/数据</text>
  <text x="480" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF">技术栈：Nuxt 3 + Vue 3 + TypeScript + TailwindCSS + ECharts + Nitro</text>
</svg>
