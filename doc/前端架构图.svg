  <line x1="355" y1="326" x2="605" y2="326" stroke="#FDBA74" stroke-width="0.5"/>
  <text x="480" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">app.vue — SideMenu + NuxtPage</text>
  <text x="480" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">SideMenu — 5项导航 (SVG图标)</text>
  <text x="480" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">Header — 标题栏 (breadcrumbs?)</text>
  <text x="480" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9A3412">页面过渡 .page-enter-active</text>
  <rect x="640" y="302" width="290" height="120" rx="5" fill="url(#boxGrad4)" stroke="#F9A8D4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="785" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9D174D">Echart 图表组件</text>
  <line x1="660" y1="326" x2="910" y2="326" stroke="#F9A8D4" stroke-width="0.5"/>
  <text x="785" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">BarChart — 柱状图</text>
  <text x="785" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">DoughnutChart — 环形图</text>
  <text x="785" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">HorizontalBarChart — 水平柱</text>
  <text x="785" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">LineChart — 折线图</text>
