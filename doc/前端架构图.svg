  <text x="297" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">/positions</text>
  <text x="297" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">多字段过滤 + 分页</text>
  <rect x="395" y="182" width="170" height="70" rx="5" fill="url(#boxGrad1)" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
