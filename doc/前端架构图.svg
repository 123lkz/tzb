  <text x="115" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">/</text>
  <text x="115" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">8 StatCard + 6 图表</text>
  <rect x="212" y="182" width="170" height="70" rx="5" fill="url(#boxGrad1)" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
