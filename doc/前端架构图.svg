  <text x="480" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">/matching</text>
  <text x="480" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">指定匹配 + 全局匹配</text>
  <rect x="578" y="182" width="170" height="70" rx="5" fill="url(#boxGrad1)" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="663" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">能力洞察</text>
  <text x="663" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">/insights</text>
  <text x="663" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">趋势分析 + 审核</text>
  <rect x="760" y="182" width="170" height="70" rx="5" fill="url(#boxGrad1)" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="845" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">知识图谱</text>
  <text x="845" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">/knowledge-graph</text>
  <text x="845" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">ECharts 力导向图</text>
  <line x1="480" y1="252" x2="480" y2="270" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
